<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Presentation</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 320px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 16px;
      }

      h1 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #475569;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      .status-dot.active  { background: #22c55e; }
      .status-dot.working { background: #f59e0b; animation: pulse 1s infinite; }
      .status-dot.error   { background: #ef4444; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }

      .field { margin-bottom: 10px; }

      label {
        display: block;
        font-size: 11px;
        color: #94a3b8;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      input, select {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 13px;
        outline: none;
      }

      input:focus, select:focus {
        border-color: #6366f1;
      }

      .lang-row {
        display: flex;
        gap: 6px;
      }

      .lang-btn {
        flex: 1;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #94a3b8;
        font-size: 12px;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
      }

      .lang-btn.selected {
        border-color: #6366f1;
        background: #312e81;
        color: #e0e7ff;
        font-weight: 600;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      button.primary {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button.primary:hover   { background: #4f46e5; }
      button.primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

      button.secondary {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #94a3b8;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      button.secondary:hover { border-color: #6366f1; color: #e0e7ff; }

      .slide-btn {
        width: 100%;
        margin-top: 8px;
        padding: 7px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #94a3b8;
        font-size: 12px;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
      }
      .slide-btn:hover { border-color: #6366f1; color: #e0e7ff; }

      #status-text {
        font-size: 11px;
        color: #64748b;
        margin-top: 10px;
        min-height: 16px;
      }
      #status-text.error-text { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>
      <span class="status-dot" id="dot"></span>
      Voice Presentation
    </h1>

    <div class="field">
      <label>API Base URL</label>
      <input type="text" id="apiBaseUrl" placeholder="https://your-app.vercel.app" />
    </div>

    <div class="field">
      <label>Model</label>
      <select id="model">
        <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
        <option value="google/gemini-flash-1.5">Gemini Flash 1.5</option>
        <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
      </select>
    </div>

    <div class="field">
      <label>Language</label>
      <div class="lang-row">
        <button class="lang-btn selected" data-lang="en-US" id="btn-en">EN</button>
        <button class="lang-btn" data-lang="it-IT" id="btn-it">IT</button>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="toggleBtn">Start</button>
      <button class="secondary" id="resetBtn">Reset</button>
    </div>

    <button class="slide-btn" id="slideWindowBtn">Open Slide Window</button>

    <div id="status-text"></div>

    <script src="popup.js"></script>
  </body>
</html>
